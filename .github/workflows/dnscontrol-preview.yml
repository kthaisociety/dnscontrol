name: DNSControl preview

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      image: ghcr.io/dnscontrol/dnscontrol:5.0.4

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Preview
        env:
          CLOUDFLARE_DNSCONTROL_TOKEN: ${{ secrets.CLOUDFLARE_DNSCONTROL_TOKEN }}
        run: |
          # pipefail: without it tee's exit status wins and a failed preview
          # would report success.
          set -o pipefail
          dnscontrol preview --no-colors 2>&1 | tee preview.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '### DNSControl preview'
            echo
            echo '```'
            cat preview.log 2>/dev/null || echo '(preview produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
