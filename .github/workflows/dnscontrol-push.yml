name: DNSControl push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: dnscontrol-apply
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      image: ghcr.io/dnscontrol/dnscontrol:5.0.4

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Push
        env:
          CLOUDFLARE_DNSCONTROL_TOKEN: ${{ secrets.CLOUDFLARE_DNSCONTROL_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          set -o pipefail
          dnscontrol push --notify --no-colors 2>&1 | tee push.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '### DNSControl push'
            echo
            echo '```'
            cat push.log 2>/dev/null || echo '(push produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
